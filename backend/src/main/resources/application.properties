spring.application.name=teapp-api
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:teapp_db}
spring.datasource.username=${POSTGRES_USER:teapp}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/teapp}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/teapp/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=teapp-api

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
