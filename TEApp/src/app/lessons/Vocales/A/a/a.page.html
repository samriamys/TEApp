@for (lessons of lessons; track $index) {
  @if ($index === currentIndex && !allCompleted) {
    <app-generic-lesson 
    [currentIndex]="currentIndex"
    (click)="onImageClick()"
    (success)="next()" [lessons]="lessons">
    </app-generic-lesson>
  }
}

@if (allCompleted) {
  <app-lessons-complete></app-lessons-complete>
  }
