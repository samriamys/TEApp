<ion-content
  [fullscreen]="true"
  [scrollEvents]="true"
  (ionScroll)="onScroll($event)"
>
  <div class="main-title">Lecciones</div>

  <div class="sticky-subtitle">{{ currentSection }}</div>

  <!-- Vocales -->
  <div id="vocales" class="section-marker"></div>

  <div class="vowels-container">
    <div class="curve">
      <div
        *ngFor="let vowel of vowels"
        class="circle vowel-{{ vowel.toLowerCase() }}"
        [ngClass]="{ selected: selectedLetter === vowel }"
        (click)="selectLetter(vowel)"
      >
        <ion-button
          class="vowel-button"
          routerDirection="forward"
          [routerLink]="[
            '/lessons/Vocales',
            vowel,
            vowel.toLowerCase()
          ]"
        >
          {{ vowel }}
        </ion-button>
      </div>
    </div>
  </div>

  <!-- Consonantes -->
  <div id="consonantes" class="subtitle">Consonantes</div>

  <div class="consonant-container">
    <div class="curve">
      <div
        *ngFor="let consonant of consonants"
        class="circle consonant-{{ consonant.toLowerCase() }}"
        [ngClass]="{ selected: selectedLetter === consonant }"
        (click)="selectLetter(consonant)"
      >
        <ion-button
          class="consonant-button"
          routerDirection="forward"
          [routerLink]="['/lessons']"
        >
          {{ consonant }}
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
