@for(exercise of exercises; track $index) { @if($index === currentIndex){
<app-generic-exercise
  *ngIf="!allCompleted && exercises.length > 0"
  [exercise]="exercises[currentIndex]"
  (success)="next()"
>
</app-generic-exercise>

} } @if (allCompleted) {
<app-exercise-complete></app-exercise-complete>
}
