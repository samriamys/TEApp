<ion-content>
  @if (loadState !== 'ready') {
    <app-learning-status [state]="loadState" backRoute="/exam" backLabel="Volver a exámenes" (retry)="cargarExamen()"></app-learning-status>
  } @else if (examCompleted) {
    <app-exam-complete [score]="score" [total]="total" [letra]="letraSeleccionada" (retry)="restart()"></app-exam-complete>
  } @else if (saving) {
    <p role="status">Guardando resultado…</p>
  } @else if (saveError) {
    <div role="alert"><p>No se pudo guardar tu resultado en este dispositivo.</p><button type="button" (click)="onExamFinished({ score: score, total: total })">Reintentar</button></div>
  } @else {
    <app-generic-exam [exercises]="exercises" (answered)="recordAnswer($event)" (finished)="onExamFinished($event)"></app-generic-exam>
  }
</ion-content>
