<div class="profile-container">
  <div class="button-container">
    <ion-button fill="clear" form="round">
      <img
        src="/assets/icon/config.svg"
        alt="Profile Picture"
        class="config-button"
      />
    </ion-button>
  </div>
  <div class="profile-info">
    <img
      src="/assets/icon/user-thumbnail.svg"
      alt="Profile Picture"
      class="profile-picture"
    />
    <div class="details-container">
      <h2 class="headers name-header">{{profile?.name}}</h2>
      <h3 class="sub-header headers">{{profile?.email}}</h3>
    </div>
  </div>

  <div class="user-code">
    <h3 class="sub-header headers">Código de tutor</h3>
    <ion-input [value]="profile?.tutorCode || ''" readonly fill="outline" class="round-input"></ion-input>
  </div>

  <div class="user-code">
    <ion-input
      inputmode="search"
      fill="outline"
      class="round-input search-input"
      [(ngModel)]="searchName"
      (ngModelChange)="filterData(searchName)"
    >
      <ion-icon
        slot="start"
        name="search-outline"
        slot="start"
        class="search-icon"
        size="large"
      ></ion-icon>
    </ion-input>
  </div>
</div>
<div class="student-list-container">
  @if (loadError) { <p role="alert">No se pudo cargar la lista de alumnos.</p> }
  @for (student of studentsData; track $index) {
  <ion-card class="student-card">
    <div class="profile-info">
      <img
        src="/assets/icon/user-thumbnail.svg"
        alt="Profile Picture"
        class="student-picture"
      />
      <div class="student-details-container">
        <h2 class="headers name-header">{{student.name}}</h2>
        <p>{{ student.email }}</p>
      </div>
    </div>
  </ion-card>
  }
</div>
