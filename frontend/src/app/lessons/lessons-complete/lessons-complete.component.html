<ion-content class="ion-text-center container">
  <ion-icon
    name="checkmark-circle"
    color="success"
    style="font-size: 128px"
  ></ion-icon>

  <div
    class="trophy-container"
    role="img"
    aria-label="Trofeo animado de felicitación"
  >
    <!-- ESTRELLAS QUE SALEN DEL TROFEO -->
    <span class="particle particle-1" aria-hidden="true">⭐</span>
    <span class="particle particle-2" aria-hidden="true">✨</span>
    <span class="particle particle-3" aria-hidden="true">⭐</span>
    <span class="particle particle-4" aria-hidden="true">✨</span>
    <span class="particle particle-5" aria-hidden="true">⭐</span>
    <span class="particle particle-6" aria-hidden="true">✨</span>

    <!-- TROFEO FLOTANTE -->
    <div class="trophy-float">
      <div class="trophy">🏆</div>
    </div>
  </div>

  <h1>¡Felicidades!</h1>
  <h2>Todas las lecciones se completaron con éxito</h2>

  <p>Has hecho un gran progreso. ¡Sigue así!</p>

  <div class="button-container">
    <!-- HOME -->
    <ion-button class="home-button" routerLink="/lessons" color="white">
      <img src="assets/image/home.png" alt="Lecciones" />
    </ion-button>

    <!-- BACK (regresa a la misma vocal) -->
    <ion-button
      class="back-button"
      [routerLink]="['/lessons/Vocales', letra.toUpperCase(), letra]"
      color="white"
    >
      <img src="assets/image/back.png" alt="Regresar" />
    </ion-button>

    <!-- NEXT (ejercicio con la misma vocal) -->
    <ion-button
      class="next-button"
      [routerLink]="['/exercise']"
      [queryParams]="{ letra: letra }"
      color="white"
    >
      <img src="assets/image/next.png" alt="Ejercicio" />
    </ion-button>
  </div>
</ion-content>
